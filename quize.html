
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GK Quiz</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to right, #667eea, #764ba2);
            font-family: Arial;
            text-align: center;
            padding: 30px;
            min-height: 100vh;
        }

        .container {
            max-width: 550px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .heading {
            color: darkred;
            font-size: 32px;
            margin-bottom: 25px;
        }

        .question {
            background: lightblue;
            color: #333;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .options {
            background: #f1f5ff;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            line-height: 35px;
        }

        .next-btn {
            background: #ff9800;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }

        .result {
            color: darkblue;
            font-size: 25px;
            margin-top: 25px;
        }

        .option-label {
            display: block;
            padding: 8px;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1 class="heading">General Knowledge Quiz</h1>

        <h3 id="p1" class="question"></h3>

        <div id="p2" class="options"></div>

        <button id="p3" class="next-btn">Next</button>

        <h2 id="p4" class="result"></h2>

    </div>

    <script>

        let questions = [
            {
                question: "What is the capital of India?",
                options: ["Chennai", "New Delhi", "Mumbai", "Kolkata"],
                answer: "New Delhi"
            },
            {
                question: "Which is the largest planet?",
                options: ["Earth", "Mars", "Jupiter", "Venus"],
                answer: "Jupiter"
            },
            {
                question: "Who is the Father of the Nation in India?",
                options: ["Nehru", "Gandhi", "Subhash Bose", "APJ Abdul Kalam"],
                answer: "Gandhi"
            },
            {
                question: "What is the national animal of India?",
                options: ["Lion", "Elephant", "Tiger", "Deer"],
                answer: "Tiger"
            },
            {
                question: "How many days are in a leap year?",
                options: ["365", "366", "364", "360"],
                answer: "366"
            },
            {
                question: "Which is the largest ocean?",
                options: ["Indian", "Atlantic", "Arctic", "Pacific"],
                answer: "Pacific"
            },
            {
                question: "Which planet is called the Red Planet?",
                options: ["Venus", "Mars", "Jupiter", "Saturn"],
                answer: "Mars"
            },
            {
                question: "What is the national flower of India?",
                options: ["Rose", "Sunflower", "Lotus", "Jasmine"],
                answer: "Lotus"
            },
            {
                question: "Which gas do plants absorb?",
                options: ["Oxygen", "Nitrogen", "Carbon dioxide", "Hydrogen"],
                answer: "Carbon dioxide"
            },
            {
                question: "Which is the smallest continent?",
                options: ["Asia", "Europe", "Africa", "Australia"],
                answer: "Australia"
            }
        ];

        let index = 0;
        let score = 0;

        let q = document.getElementById("p1");
        let op = document.getElementById("p2");
        let next = document.getElementById("p3");
        let result = document.getElementById("p4");

    

        document.body.style.backgroundAttachment = "fixed";

        document.querySelector(".container").style.border = "3px solid #ddd";

        q.style.transition = "0.3s";

        next.style.boxShadow = "0 4px 8px rgba(0,0,0,0.2)";

        result.style.padding = "10px";

        

        function displayQuestion() {

            q.innerText = (index + 1) + ". " + questions[index].question;

            op.innerHTML = "";

            questions[index].options.forEach(function(option) {

                let s = document.createElement("label");

               

                s.classList.add("option-label");

            

                s.style.borderRadius = "8px";
                s.style.marginBottom = "5px";

                let h = document.createElement("input");

                h.type = "radio";
                h.name = "answer";
                h.value = option;

              

                h.style.accentColor = "purple";
                h.style.marginRight = "10px";

                s.appendChild(h);

                s.appendChild(document.createTextNode(option));

                op.appendChild(s);

            });

        }

        displayQuestion();

       

        next.addEventListener("click", function() {

            let selected = document.querySelector(
                'input[name="answer"]:checked'
            );

            if (selected === null) {

                alert("Please select an answer!");
                return;

            }

            if (selected.value === questions[index].answer) {

                score++;

            }

            index++;

            if (index < questions.length) {

                displayQuestion();

            } else {

                q.innerText = "Quiz Completed!";

                op.innerHTML = "";

                next.style.display = "none";

               

                q.style.backgroundColor = "lightgreen";

                q.style.color = "darkgreen";

                result.innerText = "Your Score: " + score + "/10";

                result.style.backgroundColor = "lavender";

                result.style.borderRadius = "10px";

                result.style.color = "darkblue";

            }

        });

    </script>

</body>
</html>
